[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-iso20022"
version = "0.1.1"
description = "Validates, lints, and diffs ISO 20022 / pacs / camt payment messages and translates legacy MT into MX with schema-aware errors."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "fintech", "iso20022"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/iso20022"

[project.scripts]
"iso20022-emit" = "iso20022.connect:emit_main"
iso20022 = "iso20022.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iso20022"]

[tool.hatch.metadata]
allow-direct-references = true
